# Generates the contribution-grid "snake" SVGs and publishes them to the `output`
# branch, where the profile README references them. Runs on a schedule + on push,
# and can be triggered manually from the Actions tab.
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  push:
    branches:
      - main
  workflow_dispatch:          # allow manual runs

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E62429

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
