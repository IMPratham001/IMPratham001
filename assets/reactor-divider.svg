<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="14%" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7FF3FF"/>
      <stop offset="60%" stop-color="#00E5FF"/>
      <stop offset="86%" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dcore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#003554"/>
    </radialGradient>
    <radialGradient id="dhalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="dglow" x="-40%" y="-400%" width="180%" height="900%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="29" width="860" height="1.6" fill="url(#ln)" filter="url(#dglow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </rect>
  <g fill="#00E5FF" filter="url(#dglow)" opacity="0.8">
    <rect x="16" y="26" width="7" height="7" transform="rotate(45 19.5 29.8)"/>
    <rect x="877" y="26" width="7" height="7" transform="rotate(45 880.5 29.8)"/>
  </g>
  <circle cy="30" r="2.6" fill="#FFFFFF" filter="url(#dglow)">
    <animate attributeName="cx" values="60;840" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" keyTimes="0;1"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite" keyTimes="0;0.1;0.9;1"/>
  </circle>
  <circle cy="30" r="2" fill="#0A84FF" filter="url(#dglow)">
    <animate attributeName="cx" values="840;60" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.1;0.9;1"/>
  </circle>
  <circle cx="450" cy="30" fill="none" stroke="#00E5FF" stroke-width="1.3">
    <animate attributeName="r" values="10;26" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="30" r="24" fill="url(#dhalo)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="30" r="15" stroke="#00E5FF" stroke-width="3" stroke-dasharray="3 6" filter="url(#dglow)">
    <animateTransform attributeName="transform" type="rotate" from="0 450 30" to="360 450 30" dur="9s" repeatCount="indefinite"/>
  </circle>
  <polygon points="450,22 457,35 443,35" stroke="#7FF3FF" stroke-width="1.2" fill="none" opacity="0.85"/>
  <circle cx="450" cy="30" fill="url(#dcore)" filter="url(#dglow)">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </circle>
  <circle cx="450" cy="30" r="2.6" fill="#FFFFFF">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
